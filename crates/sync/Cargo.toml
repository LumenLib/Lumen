[package]
name = "sync"
version = "0.1.6"
edition = "2024"

[dependencies]
models = { workspace = true }
database = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

quick-xml = { workspace = true, features = ["serialize"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
urlencoding = { workspace = true }
unicode-normalization = { workspace = true }
trash = "5.2.6"

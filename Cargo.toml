[package]
name = "lumen"
version = "0.1.6"
edition = "2024"
description = "A modern literature manager built with GPUI"
repository = "https://github.com/LumenLib/Lumen"
license = "MIT"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
models = { path = "crates/models" }
database = { path = "crates/database" }
parser = { path = "crates/parser" }
pdf = { path = "crates/pdf" }
i18n = { path = "crates/i18n" }
translate = { path = "crates/translate" }
ai = { path = "crates/ai" }
sync = { path = "crates/sync" }
anyhow = "1.0.100"
base64 = "0.22"
chrono = "0.4"
gpui = "0.2.2"
gpui-component = "0.5.0"
image = "0.25"
log = "0.4.29"
quick-xml = "0.39.4"
reqwest = { version = "0.13.1", default-features = false }
serde = "1.0"
serde_json = "1.0"
tiktoken-rs = "0.7"
tokio = "1.49.0"
unicode-normalization = "0.1.25"
urlencoding = "2.1.3"
uuid = "1.0"
biblatex = "0.12.0"
font-kit = { version = "0.14.3", features = ["source-fontconfig-dlopen"] }
futures-util = "0.3"
hayagriva = "0.10"
mysql_async = { version = "0.34", features = ["chrono"] }
phf = { version = "0.13.1", features = ["macros"] }
regex = "1.12.2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tokio-util = { version = "0.7", features = ["io"] }

[dependencies]
models = { workspace = true }
database = { workspace = true }
parser = { workspace = true }
pdf = { workspace = true }
i18n = { workspace = true, features = ["gpui"] }
translate = { workspace = true }
ai = { workspace = true }
sync = { workspace = true }
anyhow = { workspace = true }
biblatex = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
citationberg = "0.7"
env_logger = "0.11.8"
font-kit = { workspace = true }
futures-util = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
hayagriva = { workspace = true }
image = { workspace = true }
libc = "0.2"
log = { workspace = true }
mysql_async = { workspace = true }
notify = "8.2.0"
phf = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "default-tls"] }
rusqlite = { workspace = true }
tokio-util = { workspace = true }
rust-embed = "8.9.0"
# 序列化和反序列化
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
unicode-normalization = { workspace = true }
urlencoding = { workspace = true }
# 唯一标识符生成
uuid = { workspace = true, features = ["serde", "v4"] }

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1"

[package]
name = "lumen"
version = "0.1.7"
edition = "2024"
description = "A modern literature manager built with GPUI"
repository = "https://github.com/LumenLib/Lumen"
license = "MIT"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
models = { path = "crates/models" }
database = { path = "crates/database" }
parser = { path = "crates/parser" }
pdf = { path = "crates/pdf" }
i18n = { path = "crates/i18n" }
translate = { path = "crates/translate" }
ai = { path = "crates/ai" }
sync = { path = "crates/sync" }
anyhow = "1.0.100"
chrono = "0.4"
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
log = "0.4.29"
quick-xml = "0.39.4"
reqwest = { version = "0.13.1", default-features = false }
serde = "1.0"
serde_json = "1.0"
tokio = "1.49.0"
unicode-normalization = "0.1.25"
urlencoding = "2.1.3"
uuid = "1.0"

[dependencies]
models = { workspace = true }
database = { workspace = true }
parser = { workspace = true }
pdf = { workspace = true }
i18n = { workspace = true, features = ["gpui"] }
translate = { workspace = true }
ai = { workspace = true }
sync = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
env_logger = "0.11.8"
futures-util = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui_platform = { workspace = true }
libc = "0.2"
log = { workspace = true }
notify = "8.2.0"
reqwest = { workspace = true, features = ["json", "stream", "default-tls"] }
rust-embed = "8.9.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
unicode-normalization = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1"
